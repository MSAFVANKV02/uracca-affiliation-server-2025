<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URACCA | Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #ffffff;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #cbd5f5;
      margin-bottom: 25px;
    }

    .message {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 25px;
    }

    .socials a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .socials a:hover {
      background: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* Ensure SVG icons inherit the color and are sized correctly */
    .socials svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer {
      font-size: 13px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
